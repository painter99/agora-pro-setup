# Component inventory: what this repository governs and where it is deployed.
#
# Purpose: machine-readable source of truth for drift detection. A maintenance
# pass compares this inventory against the actual repository tree (existence,
# counts) and against the deployed setup (targets). scripts/check_inventory.py
# enforces the tree side mechanically; CI runs it with the other checks.
#
# Rules:
# - Every deployable component appears here exactly once; reference-only
#   material is listed with target: none.
# - When a component is added or removed, update this inventory in the same
#   change.
# - Glob sources carry a machine-checkable "files" count; do not embed counts
#   in prose — a prose count is what drifted before the checker existed.
# - Skill names follow the Agent Skills layout: one directory per Skill under
#   skills/, the name equals the directory name (docs/2-installation.md).

meta:
  inventory_version: 3
  last_verified: "2026-10-27"

components:
  # --- deployed into the Agora app ---
  - name: system-template
    kind: prompt-template
    source: system-prompt/1-system-template.md
    target: "Agora > System Prompts > System"
  - name: user-template
    kind: prompt-template
    source: system-prompt/2-user-template.md
    target: "Agora > System Prompts > User"
  - name: assistant-template
    kind: prompt-template
    source: system-prompt/3-assistant-template.md
    target: "Agora > System Prompts > Assistant"
  - name: compact-template
    kind: prompt-template
    source: system-prompt/4-compact-template.md
    target: "Agora > System Prompts > Compact"
  - name: active-memory-template
    kind: memory-template
    source: active-memory/1-active-memory-template.md
    target: "Agora > Active Memory (copy, then customize)"
  - name: skill-set
    kind: skill-set
    # 22 skills; one directory per Skill, Agent Skills layout
    source: "skills/**/SKILL.md"
    files: 22
    target: "Agora > Saved Skills (flat namespace)"
  - name: task-cards
    kind: task-card-set
    # 5 cards + README index; cards, not verbatim prompts
    source: "tasks/*.md"
    files: 6
    target: "Agora > Tasks (instances maintained separately)"

  # --- deployed onto the host ---
  - name: platform-layer
    kind: platform-unit-templates
    # 5 units (4 services + 1 timer) + install manifest
    source: "platform/*"
    files: 6
    target: "/etc/systemd/system/ (mapping: platform/install-manifest.yaml)"

  # --- repository tooling ---
  - name: validation-checks
    kind: tooling
    source: scripts/
    target: "run in a repository checkout (python3, git, bash)"

  # --- reference only ---
  - name: decision-records
    kind: reference
    # 13 ADRs (0001-0013) + README index
    source: "decisions/*.md"
    files: 14
    target: none
  - name: active-memory-example
    kind: reference
    source: active-memory/2-active-memory-example.md
    target: none
  - name: architecture-docs
    kind: reference
    # number 19 is retired
    source: "docs/*.md"
    files: 31
    target: none
  - name: author-docs
    kind: reference
    # README, catalog conventions, format spec — not Skills
    source: "skills/*.md"
    files: 3
    target: none